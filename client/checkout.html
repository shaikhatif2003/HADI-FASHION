<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - HADI Fashion</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <header><!-- Header --></header>

  <section class="section">
    <h2 class="section-title">Checkout</h2>
    <form id="checkout-form" class="checkout-form">
      <h3>Shipping Address</h3>
      <div class="form-group">
        <label>Street</label>
        <input type="text" id="street" required>
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="city" required>
      </div>
      <div class="form-group">
        <label>ZIP</label>
        <input type="text" id="zip" required>
      </div>
      <div class="form-group">
        <label>Country</label>
        <input type="text" id="country" value="USA" required>
      </div>
      <div class="form-group">
        <label>Payment Method</label>
        <select id="payment-method" required>
          <option value="card">Credit Card (Mock)</option>
          <option value="paypal">PayPal</option>
        </select>
      </div>
      <button type="submit" class="btn" style="width:100%;">Place Order</button>
    </form>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('checkout-form').onsubmit = async (e) => {
      e.preventDefault();
      if (!HADI.getUser()) return window.location.href = 'login.html';
      
      const orderData = {
        address: {
          street: document.getElementById('street').value,
          city: document.getElementById('city').value,
          zip: document.getElementById('zip').value,
          country: document.getElementById('country').value
        },
        paymentMethod: document.getElementById('payment-method').value
      };
      
      await HADI.apiCall('/orders', {
        method: 'POST',
        headers: { 'x-auth-token': HADI.getToken(), 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });
      
      alert('Order placed successfully!');
      window.location.href = 'confirmation.html';
    };
  </script>
</body>
</html>
