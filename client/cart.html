<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - HADI Fashion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <!-- Header same -->
  </header>

  <section class="section">
    <h2 class="section-title">Your Cart</h2>
    <div id="cart-items"></div>
    <div class="cart-total">
      <h3>Total: <span id="total-price">0</span></h3>
      <button class="btn" onclick="window.location.href='checkout.html'" style="width:100%; margin-top:1rem;">Proceed to Checkout</button>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Load cart on page load
    window.addEventListener('load', loadCart);
    HADI.updateCartCount();
  </script>
</body>
</html>
