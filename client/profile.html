<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - HADI Fashion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><!-- Header --></header>

  <section class="section">
    <h2 class="section-title">Your Orders</h2>
    <div id="orders-list">
      <p>Loading orders...</p>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    window.addEventListener('load', async () => {
      await HADI.waitForAuth();
      if (!HADI.getUser()) window.location.href = 'login.html';
      
      const orders = await HADI.apiCall('/orders', {
        headers: { 'x-auth-token': HADI.getToken() }
      });
      
      const container = document.getElementById('orders-list');
      container.innerHTML = (orders || []).map(order => `
        <div class="cart-item">
          <h3>Order #${String(order.id ?? order._id).padStart(6, '0').slice(-6)}</h3>
          <p>Total: $${order.total}</p>
          <p>Status: ${order.status}</p>
          <p>Date: ${new Date(order.createdAt).toLocaleDateString()}</p>
        </div>
      `).join('') || '<p>No orders yet</p>';
    });
  </script>
</body>
</html>
