<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HADI Fashion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="nav-container">
      <a href="index.html" class="logo">HADI Fashion</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul>
    </nav>
  </header>

  <form id="login-form" class="login-form">
    <h2>Login</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" required>
    </div>
    <button type="submit" class="btn" style="width:100%;">Login</button>
    <p style="text-align:center; margin-top:1rem;">Don't have account? <a href="signup.html">Sign up</a></p>
  </form>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
