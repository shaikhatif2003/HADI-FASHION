<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HADI Fashion</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div id="loading" class="loading" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9999;"></div>

  <header>
    <nav class="nav-container">
      <a href="index.html" class="logo">HADI Fashion</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-panel">
      <div class="auth-copy">
        <span class="auth-kicker">Welcome back</span>
        <h1>Sign in to continue shopping.</h1>
        <p>Access your cart, saved profile, and order history with your HADI Fashion account.</p>
      </div>

      <form id="login-form" class="auth-card" novalidate>
        <div class="auth-card-header">
          <h2>Login</h2>
          <p>Use the email and password linked to your account.</p>
        </div>

        <div id="auth-feedback" class="auth-feedback" role="status" aria-live="polite"></div>

        <div class="form-group auth-field">
          <label for="login-email">Email</label>
          <div class="input-shell">
            <i class="ri-mail-line"></i>
            <input type="email" id="login-email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <small class="field-error" id="login-email-error"></small>
        </div>

        <div class="form-group auth-field">
          <label for="login-password">Password</label>
          <div class="input-shell">
            <i class="ri-lock-line"></i>
            <input type="password" id="login-password" autocomplete="current-password" placeholder="Enter password" required>
            <button type="button" class="password-toggle" data-toggle-password="login-password" aria-label="Show password">
              <i class="ri-eye-line"></i>
            </button>
          </div>
          <small class="field-error" id="login-password-error"></small>
        </div>

        <div class="auth-row">
          <button type="button" class="auth-link-button" id="forgot-password">Forgot password?</button>
        </div>

        <button type="submit" class="btn auth-submit">
          <span>Login</span>
          <i class="ri-arrow-right-line"></i>
        </button>

        <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
      </form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
