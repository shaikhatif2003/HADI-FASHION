<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HADI Fashion - Premium Mens Clothing</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div id="loading" class="loading" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9999;"></div>

  <header>
    <nav class="nav-container">
      <a href="index.html" class="logo">HADI Fashion</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li id="auth-link"><a href="login.html">Login</a></li>
        <li id="profile-link" style="display:none;"><a href="profile.html">Profile</a></li>
      </ul>
      <div class="icons">
        <div class="icon" onclick="window.location.href='shop.html'"><i class="ri-heart-line"></i></div>
        <div class="icon" id="cart-icon" onclick="window.location.href='cart.html'">
          <i class="ri-shopping-bag-line"></i> <span id="cart-count" class="cart-count">0</span>
        </div>
      </div>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Style for Every Man</h1>
      <p>Premium Quality Mens Fashion at Affordable Prices</p>
      <a href="shop.html" class="btn">Shop Now</a>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Featured Products</h2>
    <div class="products-grid" id="featured-products"></div>
  </section>

  <section class="section">
    <h2 class="section-title">Shop by Category</h2>
    <div class="category-grid">
      <a href="shop.html?category=shirts" class="category-card">
        <div class="category-image" style="background-image: url('https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?q=80&w=2070&auto=format&fit=crop');"></div>
        <div class="category-content">
          <h3>Shirts</h3>
        </div>
      </a>
      <a href="shop.html?category=jeans" class="category-card">
        <div class="category-image" style="background-image: url('https://images.unsplash.com/photo-1542272604-787c3835535d?q=80&w=1926&auto=format&fit=crop');"></div>
        <div class="category-content">
          <h3>Jeans</h3>
        </div>
      </a>
      <a href="shop.html?category=t-shirts" class="category-card">
        <div class="category-image" style="background-image: url('https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=2080&auto=format&fit=crop');"></div>
        <div class="category-content">
          <h3>T-Shirts</h3>
        </div>
      </a>
      <a href="shop.html?category=trousers" class="category-card">
        <div class="category-image" style="background-image: url('https://images.unsplash.com/photo-1594938298603-c8148c4dae35?q=80&w=1780&auto=format&fit=crop');"></div>
        <div class="category-content">
          <h3>Trousers</h3>
        </div>
      </a>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    window.addEventListener('load', async () => {
      await HADI.waitForAuth();
      const products = await HADI.apiCall('/products?page=1&limit=6');
      HADI.renderProducts(products || [], document.getElementById('featured-products'));

      const user = HADI.getUser();
      if (user) {
        document.getElementById('auth-link').style.display = 'none';
        document.getElementById('profile-link').style.display = 'block';
      }

      HADI.updateCartCount();
    });
  </script>
</body>
</html>
