<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - HADI Fashion</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div id="loading" class="loading" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9999;"></div>

  <header>
    <nav class="nav-container">
      <a href="index.html" class="logo">HADI Fashion</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li id="auth-link"><a href="login.html">Login</a></li>
        <li id="profile-link" style="display:none;"><a href="profile.html">Profile</a></li>
      </ul>
      <div class="icons">
        <div class="icon"><i class="ri-heart-line"></i></div>
        <div class="icon" onclick="window.location.href='cart.html'">
          <i class="ri-shopping-bag-line"></i> <span id="cart-count" class="cart-count">0</span>
        </div>
      </div>
    </nav>
  </header>

  <section class="product-detail">
    <div class="detail-images">
      <div class="main-image" id="main-image-container">
        <img id="main-image" src="" alt="Product Image" style="display:none;">
        <div id="image-placeholder" style="font-size:6rem; color:white;">S</div>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="detail-info">
      <h1 id="product-name">Product Name</h1>
      <div class="detail-price" id="product-price">₹0</div>
      <p id="stock-info" style="display:none; font-weight:600; font-size:0.9rem; margin:0.5rem 0;"></p>
      <p id="product-desc">Description</p>
      <div id="product-feedback" class="product-feedback" role="status" aria-live="polite"></div>
      <div>
        <label>Sizes:</label>
        <div class="sizes" id="sizes"></div>
      </div>
      <button class="btn add-cart" onclick="addToCart()">Add to Cart</button>
      
      <!-- Reviews -->
      <div class="reviews">
        <h3>Reviews</h3>
        <div id="reviews-list"></div>
        <div class="form-group">
          <input type="number" id="rating" min="1" max="5" placeholder="Rating (1-5)">
          <textarea id="review-text" placeholder="Write a review..."></textarea>
          <button class="btn" onclick="addReview()">Submit Review</button>
        </div>
      </div>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentProduct = {};
    let selectedSize = '';

    window.viewProduct = async (id) => {
      currentProduct = await HADI.apiCall(`/products/${id}`);
      renderProduct();
    };

    const setProductFeedback = (message, type = 'info') => {
      const feedback = document.getElementById('product-feedback');
      if (!feedback) return;
      const icon = type === 'success' ? 'ri-checkbox-circle-line' : type === 'error' ? 'ri-error-warning-line' : 'ri-information-line';
      feedback.className = `product-feedback show ${type}`;
      feedback.innerHTML = `<i class="${icon}"></i><span>${message}</span>`;
    };

    const clearProductFeedback = () => {
      const feedback = document.getElementById('product-feedback');
      if (!feedback) return;
      feedback.className = 'product-feedback';
      feedback.innerHTML = '';
    };

    const renderProduct = () => {
      if (!currentProduct) return;
      
      document.getElementById('product-name').textContent = currentProduct.name;
      
      // Price with discount
      const priceEl = document.getElementById('product-price');
      const hasDiscount = currentProduct.discount > 0;
      const finalPrice = HADI.calcDiscountedPrice(currentProduct.price, currentProduct.discount);
      
      if (hasDiscount) {
        priceEl.innerHTML = `₹${HADI.formatPrice(finalPrice)} <span style="font-size:0.55em; text-decoration:line-through; color:var(--text-light); margin-left:10px;">₹${HADI.formatPrice(currentProduct.price)}</span> <span style="font-size:0.45em; color:#2ecc71; font-weight:600; margin-left:8px;">${currentProduct.discount}% OFF</span>`;
      } else {
        priceEl.textContent = `₹${HADI.formatPrice(currentProduct.price)}`;
      }
      
      document.getElementById('product-desc').textContent = currentProduct.description;
      
      // Stock info
      const stockInfo = document.getElementById('stock-info');
      if (stockInfo) {
        if (currentProduct.stock > 0 && currentProduct.stock <= 5) {
          stockInfo.textContent = `Only ${currentProduct.stock} left in stock!`;
          stockInfo.style.color = '#e74c3c';
          stockInfo.style.display = 'block';
        } else if (currentProduct.stock <= 0) {
          stockInfo.textContent = 'Out of Stock';
          stockInfo.style.color = '#e74c3c';
          stockInfo.style.display = 'block';
        } else {
          stockInfo.textContent = 'In Stock';
          stockInfo.style.color = '#2ecc71';
          stockInfo.style.display = 'block';
        }
      }
      
      // Images
      const mainImg = document.getElementById('main-image');
      const placeholder = document.getElementById('image-placeholder');
      
      if (currentProduct.images && currentProduct.images.length > 0) {
        mainImg.src = currentProduct.images[0];
        mainImg.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        mainImg.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.textContent = currentProduct.name.charAt(0);
      }

      // Thumbs
      const thumbsEl = document.getElementById('thumbs');
      thumbsEl.innerHTML = currentProduct.images?.map((img, idx) => `
        <div class="thumb ${idx === 0 ? 'active' : ''}" onclick="changeImage(${idx})">
          <img src="${img}" style="width:100%; height:100%; object-fit:cover; border-radius:10px;">
        </div>
      `).join('') || '';
      
      // Sizes
      const sizesEl = document.getElementById('sizes');
      sizesEl.innerHTML = currentProduct.sizes?.map(size => 
        `<div class="size-btn ${size === selectedSize ? 'active' : ''}" onclick="selectSize('${size}')">${size}</div>`
      ).join('') || '<p>No sizes available</p>';
      
      // Reviews
      const reviewsEl = document.getElementById('reviews-list');
      reviewsEl.innerHTML = currentProduct.reviews?.map(r => `
        <div class="review">
          <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
          <p>${r.comment}</p>
        </div>
      `).join('') || '<p>No reviews yet</p>';

      // Update page title
      document.title = `${currentProduct.name} - HADI Fashion`;
    };

    const selectSize = (size) => {
      selectedSize = size;
      document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    };

    window.addToCart = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = currentProduct.id ?? currentProduct._id ?? urlParams.get('id');

      if (!productId) {
        setProductFeedback('Could not identify product. Please refresh the page and try again.', 'error');
        return;
      }
      if (!selectedSize) {
        setProductFeedback('Select a size before adding this item to cart.', 'error');
        return;
      }

      clearProductFeedback();
      const btn = document.querySelector('.add-cart');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Adding...';

      try {
        if (!HADI.getUser()) {
          const localCart = JSON.parse(localStorage.getItem('cart') || '[]');
          const existingItem = localCart.find(item => (item.productId?.id ?? item.productId?._id) === productId && item.size === selectedSize);

          if (existingItem) {
            existingItem.quantity += 1;
          } else {
            localCart.push({
              id: `local-${Date.now()}`,
              _id: `local-${Date.now()}`,
              quantity: 1,
              size: selectedSize,
              productId: currentProduct.id ? currentProduct : { ...currentProduct, id: productId, _id: productId }
            });
          }

          localStorage.setItem('cart', JSON.stringify(localCart));
          HADI.updateCartCount();
        } else {
          await HADI.apiCall('/cart', {
            method: 'POST',
            headers: { 'x-auth-token': HADI.getToken() },
            body: JSON.stringify({ productId, size: selectedSize })
          });
          HADI.updateCartCount();
        }

        btn.innerHTML = '<i class="ri-check-line"></i> Added to Cart!';
        btn.style.backgroundColor = '#2ecc71';
        btn.style.color = 'white';
        btn.style.borderColor = '#2ecc71';
        setProductFeedback('Added to cart. You can keep shopping or review your bag.', 'success');
        
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = originalText;
          btn.style.backgroundColor = '';
          btn.style.color = '';
          btn.style.borderColor = '';
        }, 2000);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        console.error(err);
        setProductFeedback('Failed to add to cart. Please try again.', 'error');
      }
    };

    window.changeImage = (index) => {
      if (!currentProduct.images || !currentProduct.images[index]) return;
      
      const mainImg = document.getElementById('main-image');
      mainImg.src = currentProduct.images[index];
      
      document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));
    };

    window.addReview = () => {
      // Mock - in real, POST to /products/:id/reviews
      alert('Review added (mock)');
    };

    window.addEventListener('load', async () => {
      await HADI.waitForAuth();
      // Get product ID from URL
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('id')) {
        viewProduct(urlParams.get('id'));
      }
      HADI.updateCartCount();
      
      const user = HADI.getUser();
      if (user) {
        document.getElementById('auth-link').style.display = 'none';
        document.getElementById('profile-link').style.display = 'block';
      }
    });
  </script>
</body>
</html>
